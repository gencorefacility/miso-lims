miso.display.bulk.requisition:false
miso.display.bulk.qcStatus:false
miso.display.bulk.matrixBarcode:false
miso.display.bulk.discarded:false
miso.defaults.bulk.detailedQcStatus:Ready
miso.defaults.bulk.poolQcPassed:true
miso.display.bulk.receipt:false
miso.defaults.bulk.senderLab:External
miso.display.bulk.boxFields:false
miso.display.bulk.parentLocation:false
miso.display.bulk.workstation:false
miso.display.bulk.thermalCycler:false
miso.display.bulk.kitLot:false
